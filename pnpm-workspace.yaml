# pnpm v11 配置家（替代已废弃的 package.json `pnpm` 字段）
# 声明为单包 workspace，使 onlyBuiltDependencies 被读取
packages:
  - '.'

allowBuilds:
  esbuild: set this to true or false
  unrs-resolver: set this to true or false

# 仅允许以下依赖运行安装期构建脚本
# esbuild：需链接平台原生二进制，否则 vitest 无法启动
# unrs-resolver：eslint 导入解析链路的原生加速模块
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
