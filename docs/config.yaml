# DNS Shield 文档事实配置 · 文档集版本 v3.22.4 · 最后审查 2026-11-27
# 版本权威源：package.json；本文件 version 字段由 scripts/sync-facts.mjs 守护
schema: spec-driven
lastReviewed: "2026-11-27"

# Project context
context: |
  Tech stack: TypeScript, React 18, Next.js 14, Tailwind CSS 3.4, shadcn/ui, sonner
  We use conventional commits
  Domain: DNS-based ad blocking
  Project structure follows Next.js App Router conventions
  We use SemVer for versioning
  We maintain a single source of truth in public/domains.txt
  We support 12 output formats: dnsmasq, hosts, AdGuard, whitelist, Unbound, Pi-hole, plain domains, Bind RPZ, SmartDNS, Mosdns, Clash Meta, and CoreDNS
  We follow strict file header format with version and date
  whitelist.txt is a generated artifact (scripts/gen-format-files.mjs); do not edit it directly
  We use Next.js App Router with page.tsx, layout.tsx, and Home.tsx components
  We have 16 internationalization languages (default Simplified Chinese, then Traditional Chinese, then English)
  Language priority zh-cn > zh-tw > en; <html lang> and SEO inLanguage stay in sync
  We use shadcn/ui components (Radix UI based) with Tailwind CSS
  We use sonner for toast notifications
  Dev server runs on port 3000 (npm run dev)
  Large inputs (>=20000 lines) use multi-core Web Worker shard parsing with graceful fallback
  Parse tasks are single-flighted by a content key (task + text) and the worker pool reference is stable (memory guard)
  CI runs a root temp-file hygiene gate (scripts/check-root-clean.mjs) before the CI Gate aggregator; all temporary files must live under the repo-root .tmp/ directory (see docs/TEMP-FILES.md), auto-created by npm run tmp:init and cleared by npm run tmp:clean
  Third-party GitHub Actions are pinned to commit SHAs (e.g. actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6); upgrade only via Dependabot PR
  Package manager is npm (package-lock.json only); pnpm-lock.yaml was removed. engines: node >=24.15.0 <25, npm >=11
  Format switching uses OutputPanel.formatSelect.tsx (single dropdown); ui/Tabs.tsx, Card.tsx, Loading.tsx and Switch.tsx were removed along with their Radix packages

# Per-artifact rules
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include testing tasks for all functionality changes
  spec:
    - Maintain consistency with actual project structure
    - Update dependency versions to match package.json
    - Include all supported router platforms
    - Keep version number in sync with package.json
  checklist:
    - Include all required files and configurations
    - Verify all generated file formats
    - Ensure router compatibility testing
    - Match actual file structure on main branch

# Component registry
components:
  ui:
    - name: "Badge"
      file: "src/components/ui/Badge.tsx"
      parts: ["Badge"]
    - name: "Button"
      file: "src/components/ui/Button.tsx"
      parts: ["Button", "buttonVariants"]
    - name: "Checkbox"
      file: "src/components/ui/Checkbox.tsx"
      parts: ["Checkbox"]
    - name: "DropdownMenu"
      file: "src/components/ui/DropdownMenu.tsx"
      parts: ["DropdownMenu", "DropdownMenuTrigger", "DropdownMenuContent", "DropdownMenuItem", "DropdownMenuLabel", "DropdownMenuSeparator"]
    - name: "Input"
      file: "src/components/ui/Input.tsx"
      parts: ["Input"]
    - name: "Label"
      file: "src/components/ui/Label.tsx"
      parts: ["Label"]
    - name: "EmptyState"
