# .github/workflows/aggregate.yml
# ---------------------------------------------------------------------------
# Aggregate —— 定时聚合上游拦截规则源
#
# 触发：每周一 03:17 UTC 自动运行（避免整点高峰）
#
# 行为：
#   1. 拉取 AdGuard / EasyList / NeoHosts / StevenBlack / YousList 等上游源
#   2. 提取黑名单域名并与 public/domains.txt 合并去重排序
#   3. 仅在确有新增域名时，自动发起 Pull Request 供人工审核合并
#
# 说明：使用 PR 而非直接推送，保证规则更新经过审查，避免误吞上游异常条目。
# 权限：需要 contents: write（推送 PR 分支）+ pull-requests: write（开 PR）。
# 注意：本 PR 会同时重新生成 11 个派生规则文件（与 domains.txt 同源），
#      否则 CI 的「生成文件漂移」硬门禁会拦下只改数据源、未同步派生的 PR。
# ---------------------------------------------------------------------------
name: Aggregate Upstream Lists

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  # create-pull-request 需要向 auto/aggregate-upstream 分支推送提交，
  # 仅 pull-requests: write 会在 push 阶段报 403 而整 job 失败
  contents: write
  pull-requests: write

# 避免上一轮周任务仍在跑（或并发手动触发）时重叠提交，造成 PR 内容互相覆盖
concurrency:
  group: aggregate-upstream
  cancel-in-progress: false

jobs:
  aggregate:
    name: Fetch & merge upstream blocklists
    runs-on: ubuntu-latest
    # 挂死保护：上游 5 个源串行拉取，正常 2~5 分钟；超时即失败
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Aggregate upstream domains
        run: node scripts/aggregate-upstream.mjs

      # 同步重新生成 11 个派生规则文件：否则自动 PR 只改 domains.txt，
      # 会被 CI 的「生成文件漂移」硬门禁拦下（派生文件未同步 → 漂移），
      # 必须人工补生成，违背自动聚合的初衷。派生文件为纯 Node 脚本生成，
      # 与 domains.txt 同源，无新增依赖。
      - name: Regenerate derived rule files
        run: node scripts/gen-format-files.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: 'chore: 聚合上游拦截规则源（自动）'
          title: 'chore: 聚合上游拦截规则源'
          body: |
            本 PR 由 `aggregate.yml` 定时任务自动生成。

            脚本从 AdGuard / EasyList / NeoHosts / StevenBlack / YousList 提取黑名单域名，
            与 `public/domains.txt` 合并去重后更新，并同步重新生成 11 个派生格式文件，
            使 PR 通过 CI 的「生成文件漂移」硬门禁。

            请审核变更后再合并。
          branch: auto/aggregate-upstream
          delete-branch: true
          # 仅暂存发生变化的文件：domains.txt 与重新生成的 11 个派生文件；
          # public/ 下未改动的图像等不会被纳入。
          add-paths: |
            public/domains.txt
            public/category-index.txt
            public/dnsmasq.conf
            public/hosts.txt
            public/adguard.txt
            public/whitelist.txt
            public/unbound.conf
            public/pihole.txt
            public/rpz.db
            public/smartdns.conf
            public/mosdns_domain_set.txt
            public/clash_dns.yaml
            public/coredns_hosts.txt
