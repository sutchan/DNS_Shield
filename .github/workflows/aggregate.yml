# .github/workflows/aggregate.yml
# ---------------------------------------------------------------------------
# Aggregate —— 定时聚合上游拦截规则源
#
# 触发：每周一 03:17 UTC 自动运行（避免整点高峰）
#
# 行为：
#   1. 拉取 AdGuard / EasyList / NeoHosts / StevenBlack / YousList 等上游源
#   2. 提取黑名单域名并与 public/domains.txt 合并去重排序
#   3. 仅在确有新增域名时，自动发起 Pull Request 供人工审核合并
#
# 说明：使用 PR 而非直接推送，保证规则更新经过审查，避免误吞上游异常条目。
# ---------------------------------------------------------------------------
name: Aggregate Upstream Lists

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  aggregate:
    name: Fetch & merge upstream blocklists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Aggregate upstream domains
        run: node scripts/aggregate-upstream.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: 聚合上游拦截规则源（自动）'
          title: 'chore: 聚合上游拦截规则源'
          body: |
            本 PR 由 `aggregate.yml` 定时任务自动生成。

            脚本从 AdGuard / EasyList / NeoHosts / StevenBlack / YousList 提取黑名单域名，
            与 `public/domains.txt` 合并去重后更新。

            请审核变更后再合并。
          branch: auto/aggregate-upstream
          delete-branch: true
          add-paths: |
            public/domains.txt
