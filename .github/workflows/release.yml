# .github/workflows/release.yml
# ---------------------------------------------------------------------------
# Release —— 版本发布
#
# 触发：推送形如 v3.11.2 的 tag
#
# 做三件事：
#   1. 校验 tag 与 package.json 的 version 一致（防止打错版本号发布）
#   2. 以 public/domains.txt 为单一数据源，重新生成全部过滤规则文件
#   3. 把规则文件打包为 GitHub Release 资产（同时提供 zip 与单文件）
#
# 资产清单来自 `node scripts/gen-format-files.mjs --list-files`（唯一来源 = 生成脚本的
# OUTPUT_FILES），不再在 workflow 里手写文件名——新增输出格式时无需再改本文件，
# 杜绝"加了格式却漏发 Release 资产"的历史问题。
#
# 推荐发布流程：
#   pnpm version patch|minor|major   # 自动改 package.json 并打 tag
#   git push --follow-tags
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish rule files
    runs-on: ubuntu-latest
    # 挂死保护：正常 1~2 分钟内完成，超时即失败，避免空耗额度
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      # tag 与 package.json 版本号必须一致，否则产出的规则文件头会与源码版本脱节
      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          echo "tag = ${GITHUB_REF_NAME}"
          echo "pkg = ${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致"
            exit 1
          fi

      - name: Regenerate rule files
        run: node scripts/gen-format-files.mjs

      - name: Count domains
        id: count
        run: |
          node scripts/count-domains.mjs | tee _count.log
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat _count.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 资产清单：来自生成脚本的单一来源，逐行一个 public/ 相对路径
      - name: Collect artifact list
        id: artifacts
        run: |
          mapfile -t FILES < <(node scripts/gen-format-files.mjs --list-files)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::产物清单为空，请检查 scripts/gen-format-files.mjs"
            exit 1
          fi
          echo "共 ${#FILES[@]} 个规则文件："
          printf '  %s\n' "${FILES[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${FILES[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Package rule files
        id: package
        run: |
          mapfile -t FILES < <(node scripts/gen-format-files.mjs --list-files)
          ZIP="dns-shield-rules-${GITHUB_REF_NAME}.zip"
          # 用 zip 保持目录结构；runner 自带 zip。-j 压平目录，规则文件均在 public/ 根级
          zip -j "$ZIP" "${FILES[@]}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DNS Shield ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 规则文件统计

            ```
            ${{ steps.count.outputs.body }}
            ```

            本版本由 `public/domains.txt` 单一数据源生成，共 12 种格式（含数据源本身）。
            安装方式见 [README](https://github.com/${{ github.repository }}#readme)。
          # 资产 = 归档 + 全部单文件（清单由上一步从生成脚本单一来源导出，含新增格式）
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.artifacts.outputs.files }}
