# .github/workflows/ci.yml
# ---------------------------------------------------------------------------
# CI —— 质量门禁（Quality Gate）
#
# 触发时机：
#   - 推送到 main / dev
#   - 针对 main / dev 的 Pull Request
#   - 手动触发（workflow_dispatch，可勾选是否跳过覆盖率以加速验证）
#
# 任务编排（并行 + 聚合）：
#   lint ───────┐
#   typecheck ──┤
#   test ───────┼──► ci（聚合门禁，分支保护只需勾选这一个 check）
#   build ──────┤
#   data ───────┘
#
# 为什么用聚合 job：后续增删 job 不必反复改分支保护规则；
# 任一上游 job 失败 → ci 失败 → PR 不可合并。
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      skip-coverage:
        description: '跳过覆盖率收集（加速验证）'
        type: boolean
        default: false

# 同一分支 / PR 重复推送时取消旧运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # runner 提供约 7GB 内存，留出余量防止 NEXT 构建期 OOM
  NODE_OPTIONS: '--max-old-space-size=4096'
  NEXT_TELEMETRY_DISABLED: '1'
  # 构建期注入 GA 统计 ID；未配置该 Secret 时自动为空（不启用统计）
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
  # 关闭 ANSI 着色：否则步骤摘要里的 grep 会被转义码打断，匹配不到 "Tests" 行
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  CI: 'true'

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

  # ----------------------------------------------------------- typecheck
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 使用项目本地 TypeScript（package.json 锁定 ^5），避免 runner 预装版本漂移
      - name: Type check (no emit)
        run: pnpm exec tsc --noEmit

  # ---------------------------------------------------------------- test
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.skip-coverage }}" = "true" ]; then
            pnpm run test 2>&1 | tee _test.log
          else
            pnpm run test:coverage 2>&1 | tee _test.log
          fi

      - name: Write test summary
        if: always()
        run: |
          {
            echo '### 单元测试结果'
            echo '```'
            grep -E 'Test Files|Tests|Duration' _test.log || echo '(未解析到测试摘要)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() && github.event.inputs.skip-coverage != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------- build
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 复用 Next.js 构建缓存，二次构建通常可省 40%~60% 时间
      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: .next/cache
          # 显式限定目录，避免 hashFiles 遍历 node_modules 拖慢耗时
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.js', 'tailwind.config.js', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build
        run: pnpm run build

      - name: Report build size
        if: always()
        run: |
          {
            echo '### 构建产物'
            echo '```'
            du -sh .next 2>/dev/null || echo '(未生成 .next 目录)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- 数据与多语言一致性
  data:
    name: Data Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 这些脚本是纯 Node，无第三方依赖，跳过安装可省 30s+
      - uses: ./.github/actions/setup
        with:
          install: 'false'

      # 16 种语言的缺键 / 多键校验。运行时有 deepMerge 兜底，问题不会暴露到 UI，
      # 因此必须在 CI 阶段拦住漏翻。
      - name: Check locale key parity
        run: node scripts/check-locales.mjs

      # 单一数据源 public/domains.txt 的黑名单 / 白名单计数
      - name: Count domains
        run: node scripts/count-domains.mjs

      # 硬门禁：重新生成 12 种规则文件并与仓库内容比对。
      # public/* 头部含「版本::」与「更新::」两行：
      #   - 「更新::」是生成日期，每天都会变，属噪声，从比对中剔除；
      #   - 「版本::」必须与 package.json 一致，属真实漂移，需要阻断。
      # 修复方式：本地执行 pnpm run build:formats 后提交产物。
      - name: Detect generated rule files drift
        id: drift
        run: |
          node scripts/gen-format-files.mjs
          # 过滤掉仅日期行产生的差异（+/- 两种前缀），剩余即真实内容漂移
          DRIFT_LINES=$(git diff -- public \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]!#]*更新::' || true)
          if [ -z "$(echo "$DRIFT_LINES" | tr -d '[:space:]')" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "生成的规则文件与 public/domains.txt 一致（已忽略头部日期行）"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::error::规则文件与数据源漂移，请执行 pnpm run build:formats 后提交产物"
            echo "$DRIFT_LINES" | head -n 40
            echo "--- 差异统计 ---"
            git diff --stat -- public
            exit 1
          fi

      - name: Write data summary
        if: always()
        run: |
          {
            echo '### 数据一致性'
            echo "- locale 键校验：通过"
            echo "- 生成文件漂移：${{ steps.drift.outputs.drift == 'true' && '存在（已阻断）' || '无（已忽略头部日期行）' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ 聚合门禁
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test, build, data]
    if: always()
    steps:
      - name: Check upstream results
        run: |
          echo "lint      = ${{ needs.lint.result }}"
          echo "typecheck = ${{ needs.typecheck.result }}"
          echo "test      = ${{ needs.test.result }}"
          echo "build     = ${{ needs.build.result }}"
          echo "data      = ${{ needs.data.result }}"
          if printf '%s\n' \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.data.result }}" | grep -qv '^success$'; then
            echo "::error::质量门禁未通过，详见上方各 job 日志。"
            exit 1
          fi
          echo "全部检查通过"
