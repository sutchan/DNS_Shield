name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 任务：代码质量门禁 —— 每次 PR/推送到 main 自动执行 lint + 测试(含覆盖率) + 构建。
# 与 CODE_REVIEW.md 中的「合并前审查」触发时机对应。
jobs:
  quality-gate:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
