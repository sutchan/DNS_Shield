# .github/workflows/ci.yml
# ---------------------------------------------------------------------------
# CI —— 质量门禁（Quality Gate）
#
# 触发时机：
#   - 推送到 main / dev
#   - 针对 main / dev 的 Pull Request
#   - 手动触发（workflow_dispatch，可勾选是否跳过覆盖率以加速验证）
#
# 任务编排（并行 + 聚合）：
#   lint ───────┐
#   typecheck ──┤
#   test ───────┼──► ci（聚合门禁，分支保护只需勾选这一个 check）
#   build ──────┤
#   data ───────┘
#
# 为什么用聚合 job：后续增删 job 不必反复改分支保护规则；
# 任一上游 job 失败 → ci 失败 → PR 不可合并。
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      skip-coverage:
        description: '跳过覆盖率收集（加速验证）'
        type: boolean
        default: false

# 同一分支 / PR 重复推送时取消旧运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # runner 提供约 7GB 内存，留出余量防止 NEXT 构建期 OOM
  NODE_OPTIONS: '--max-old-space-size=4096'
  NEXT_TELEMETRY_DISABLED: '1'
  # 构建期注入 GA 统计 ID；未配置该 Secret 时自动为空（不启用统计）
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
  # 关闭 ANSI 着色：否则步骤摘要里的 grep 会被转义码打断，匹配不到 "Tests" 行
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  CI: 'true'

jobs:
  # --------------------------------------------------- root cleanliness
  rootclean:
    name: Root Tmp Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Verify no stray temp files at repo root
        run: node scripts/check-root-clean.mjs

      - name: Verify security headers parity (Next.js / EdgeOne)
        run: node scripts/check-security-headers.mjs

  # ---------------------------------------------------------------- lint
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: npm run lint

  # ----------------------------------------------------------- typecheck
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup

      # 使用项目本地 TypeScript（package.json 锁定 ^5），避免 runner 预装版本漂移
      - name: Type check (no emit)
        run: npx tsc --noEmit

  # ---------------------------------------------------------------- test
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p .tmp/logs
          if [ "${{ github.event.inputs.skip-coverage }}" = "true" ]; then
            npm run test 2>&1 | tee .tmp/logs/test.log
          else
            npm run test:coverage 2>&1 | tee .tmp/logs/test.log
          fi

      - name: Write test summary
        if: always()
        run: |
          {
            echo '### 单元测试结果'
            echo '```'
            grep -E 'Test Files|Tests|Duration' .tmp/logs/test.log || echo '(未解析到测试摘要)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() && github.event.inputs.skip-coverage != 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------- build
  build:
    name: Next.js Build
    # T-A11Y-01：ubuntu-latest 已迁移至 26.04，而 Playwright 1.56 尚无该发行版的
    # 浏览器依赖定义（install --with-deps 直接失败）。固定到受支持的 24.04，
    # 待 Playwright 升级到支持 26.04 的版本后再恢复 latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup

      # 复用 Next.js 构建缓存，二次构建通常可省 40%~60% 时间
      - name: Cache Next.js build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          # 显式限定目录，避免 hashFiles 遍历 node_modules 拖慢耗时
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'package.json', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.js', 'tailwind.config.js', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build
        run: npm run build

      # T-DOC-04：构建后立即对 OpenAPI 声明的真实端点做契约冒烟，
      # 避免规范与线上路由/静态产物漂移。
      - name: API contract smoke
        run: npm run check:api-contract

      # T-A11Y-01：复用本 job 的 .next 产物启动独立端口，axe 扫描首页/关于页/弹窗，
      # 仅阻断 critical 违规，其余等级输出到日志供人工评估。
      - name: Install Chromium for accessibility scan
        run: npx playwright install --with-deps chromium

      - name: Accessibility smoke (axe + Playwright)
        run: npm run check:a11y

      - name: Report build size
        if: always()
        run: |
          {
            echo '### 构建产物'
            echo '```'
            du -sh .next 2>/dev/null || echo '(未生成 .next 目录)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- 数据与多语言一致性
  data:
    name: Data Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # check-doc-facts 在缺少 Vitest JSON 报告时会调用本地 vitest 采集用例数，
      # 因此必须安装依赖；此前 install:false 导致 CI 的文档事实门禁假红。
      - uses: ./.github/actions/setup

      # 16 种语言的缺键 / 多键校验。运行时有 deepMerge 兜底，问题不会暴露到 UI，
      # 因此必须在 CI 阶段拦住漏翻。
      - name: Check locale key parity
        run: node scripts/check-locales.mjs

      # 单一数据源 public/domains.txt 的黑名单 / 白名单计数
      - name: Count domains
        run: node scripts/count-domains.mjs

      # T-REL-01：分类索引必须随仓库发布，否则线上 /category-index.txt 返回 404
      - name: Assert category index is shipped
        run: |
          if [ ! -s public/category-index.txt ]; then
            echo "::error::public/category-index.txt 缺失或为空，分类筛选会 404"
            exit 1
          fi
          echo "分类索引已入库：$(wc -l < public/category-index.txt) 行"

      # 文档版本展示位与 package.json 一致性（硬门禁）。
      # 版本号曾分散在 40+ 处手工维护，prototype/ 一度停在 3.9.3、DEPLOYMENT 停在 3.8.8。
      # 修复方式：本地执行 node scripts/sync-facts.mjs 后提交。
      - name: Verify version facts are synced
        run: node scripts/sync-facts.mjs --check

      # T-DOC-03：文档中的测试数/键数/域名数/展示位数/超行数必须由权威源推导，
      # 历史多次人工维护导致同一事实出现多套数字，此处按脚本实算结果阻断漂移。
      - name: Verify document facts match code
        run: npm run check:doc-facts

      # T-VERIFY-01：OpenAPI 3.1 定义的结构与版本一致性（离线可跑）
      - name: Validate OpenAPI 3.1 definition
        run: node scripts/check-openapi.mjs

      # 硬门禁：重新生成 11 个格式产物文件并与仓库内容比对。
      # public/* 头部含「版本::」与「更新::」两行：
      #   - 「更新::」是生成日期，每天都会变，属噪声，从比对中剔除；
      #   - 「版本::」必须与 package.json 一致，属真实漂移，需要阻断。
      # 修复方式：本地执行 npm run build:formats 后提交产物。
      - name: Detect generated rule files drift
        id: drift
        run: |
          node scripts/gen-format-files.mjs
          # 过滤掉仅日期行产生的差异（+/- 两种前缀），剩余即真实内容漂移。
          # 注释前缀因格式而异：#（hosts/dnsmasq 等）、!（AdGuard）、;（Bind RPZ）——三者都要剔除
          DRIFT_LINES=$(git diff -- public \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]!#;]*更新::' || true)
          if [ -z "$(echo "$DRIFT_LINES" | tr -d '[:space:]')" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "生成的规则文件与 public/domains.txt 一致（已忽略头部日期行）"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::error::规则文件与数据源漂移，请执行 npm run build:formats 后提交产物"
            echo "$DRIFT_LINES" | head -n 40
            echo "--- 差异统计 ---"
            git diff --stat -- public
            exit 1
          fi

      - name: Write data summary
        if: always()
        run: |
          {
            echo '### 数据一致性'
            echo "- locale 键校验：通过"
            echo "- 生成文件漂移：${{ steps.drift.outputs.drift == 'true' && '存在（已阻断）' || '无（已忽略头部日期行）' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ 聚合门禁
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rootclean, lint, typecheck, test, build, data]
    if: always()
    steps:
      - name: Check upstream results
        run: |
          echo "root-clean = ${{ needs.rootclean.result }}"
          echo "lint      = ${{ needs.lint.result }}"
          echo "typecheck = ${{ needs.typecheck.result }}"
          echo "test      = ${{ needs.test.result }}"
          echo "build     = ${{ needs.build.result }}"
          echo "data      = ${{ needs.data.result }}"
          if printf '%s\n' \
            "${{ needs.rootclean.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.data.result }}" | grep -qv '^success$'; then
            echo "::error::质量门禁未通过，详见上方各 job 日志。"
            exit 1
          fi
          echo "全部检查通过"
