# .github/actions/setup/action.yml
# ---------------------------------------------------------------------------
# 复合动作（composite action）：统一 CI / Deploy / Release 四个工作流的运行时准备。
#
# 关键点（踩坑记录，勿随意改动顺序）：
#   1. 本项目使用 npm（v3.22.0 起移除 pnpm 依赖）：锁文件为 package-lock.json，
#      CI 一律用 `npm ci`（等价于 pnpm 的 --frozen-lockfile），本地开发用
#      `npm install`。
#   2. package-lock.json 必须入库：若锁文件缺失，本步骤会在 install 前显式
#      报错，而不是让 npm 静默解析出与仓库不一致的依赖树。
#   3. 依赖缓存直接用 setup-node 内置的 cache: 'npm'（缓存 ~/.npm 缓存目录），
#      不需要额外的 store 路径解析步骤——npm 的缓存路径是稳定的，历史上
#      pnpm 11 的 store 路径大改曾导致缓存 job 全败。
#   4. Node 版本对齐 package.json 的 engines.node（>=24.11.0 <25，锁定 Node 24
#      主版本，避免 Vercel 自动升级到 26.x）；npm 版本由 Node 24 自带，
#      要求 >=11（见 package.json engines.npm）。
# ---------------------------------------------------------------------------
name: 'Setup DNS Shield'
description: '安装 Node.js（自带 npm），恢复 npm 依赖缓存并按锁定文件安装依赖'

inputs:
  node-version:
    description: 'Node.js 版本（须满足 package.json engines.node）'
    required: false
    default: '24'
  install:
    description: '是否执行依赖安装'
    required: false
    default: 'true'
  frozen:
    description: '是否使用 npm ci（CI 必须为 true）'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Assert lockfile is tracked
      if: inputs.install == 'true' && inputs.frozen == 'true'
      shell: bash
      run: |
        if [ ! -f package-lock.json ]; then
          echo "::error::缺少 package-lock.json：CI 以 npm ci 安装，请先在本地执行 npm install 并提交锁文件"
          exit 1
        fi

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.frozen }}" = "true" ]; then
          npm ci
        else
          npm install
        fi

    - name: Print toolchain
      shell: bash
      run: |
        echo "node    : $(node -v)"
        echo "npm     : $(npm -v)"
        echo "lockfile: $([ -f package-lock.json ] && echo present || echo missing)"
        echo "registry: $(npm config get registry)"
