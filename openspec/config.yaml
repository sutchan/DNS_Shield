schema: spec-driven

# Project context
context: |
  Tech stack: TypeScript, React 18, Next.js 14, Tailwind CSS 3.4, shadcn/ui, sonner
  We use conventional commits
  Domain: DNS-based ad blocking
  Project structure follows Next.js App Router conventions
  We use SemVer for versioning
  We maintain a single source of truth in public/domains.txt
  We support multiple output formats: dnsmasq, hosts, AdGuard, and whitelist
  We follow strict file header format with version and date
  We maintain whitelist.txt for whitelist rules
  We use Next.js App Router with page.tsx, layout.tsx, and Home.tsx components
  We have 16 internationalization languages
  We use shadcn/ui components (Radix UI based) with Tailwind CSS
  We use sonner for toast notifications
  Dev server runs on port 8082 (pnpm dev)

# Per-artifact rules
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include testing tasks for all functionality changes
  spec:
    - Maintain consistency with actual project structure
    - Update dependency versions to match package.json
    - Include all supported router platforms
    - Keep version number in sync with package.json
  checklist:
    - Include all required files and configurations
    - Verify all generated file formats
    - Ensure router compatibility testing
    - Match actual file structure on main branch

# Component registry
components:
  ui:
    - name: "Badge"
      file: "src/components/ui/Badge.tsx"
      parts: ["Badge"]
    - name: "Button"
      file: "src/components/ui/Button.tsx"
      parts: ["Button", "buttonVariants"]
    - name: "Card"
      file: "src/components/ui/Card.tsx"
      parts: ["Card", "CardHeader", "CardTitle", "CardDescription", "CardContent", "CardFooter"]
    - name: "Checkbox"
      file: "src/components/ui/Checkbox.tsx"
      parts: ["Checkbox"]
    - name: "DropdownMenu"
      file: "src/components/ui/DropdownMenu.tsx"
      parts: ["DropdownMenu", "DropdownMenuTrigger", "DropdownMenuContent", "DropdownMenuItem", "DropdownMenuLabel", "DropdownMenuSeparator"]
    - name: "Input"
      file: "src/components/ui/Input.tsx"
      parts: ["Input"]
    - name: "Label"
      file: "src/components/ui/Label.tsx"
      parts: ["Label"]
    - name: "Loading"
      file: "src/components/ui/Loading.tsx"
      parts: ["Loading"]
    - name: "Select"
      file: "src/components/ui/Select.tsx"
      parts: ["Select", "SelectTrigger", "SelectValue", "SelectContent", "SelectItem"]
    - name: "Switch"
      file: "src/components/ui/Switch.tsx"
      parts: ["Switch"]
    - name: "Tabs"
      file: "src/components/ui/Tabs.tsx"
      parts: ["Tabs", "TabsList", "TabsTrigger", "TabsContent"]
    - name: "Toast"
      file: "src/components/ui/Toast.tsx"
      parts: ["Toast", "toast"]

version: "3.6.0"
