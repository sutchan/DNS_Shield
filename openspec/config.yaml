# DNS Shield - OpenSpec 配置文件
# 用于规范项目结构、组件命名和行为标准

version: "1.0"
project:
  name: "DNS Shield"
  type: "web-application"
  framework: "next.js"
  language: "typescript"
  version: "2.3.0"

directories:
  source: "src"
  components: "src/components"
  ui_components: "src/components/ui"
  hooks: "src/hooks"
  utils: "src/utils"
  locales: "src/locales"
  styles: "src/app"
  prototype: "prototype"
  docs: "docs"
  openspec: "openspec"

naming:
  components:
    style: "PascalCase"  # 例如: InputPanel.tsx
    prefix: ""           # 例如: Header.tsx
  hooks:
    style: "camelCase"   # 例如: useDomainData.ts
    prefix: "use"        # 例如: useTheme
  utils:
    style: "camelCase"   # 例如: fileUtils.ts
  css_classes:
    style: "kebab-case"  # 例如: btn-primary
  css_variables:
    style: "kebab-case"  # 例如: --color-primary

components:
  ui:
    - name: "Button"
      file: "src/components/ui/Button.tsx"
      variants: ["default", "secondary", "destructive", "outline", "ghost", "link"]
      sizes: ["sm", "default", "lg", "icon"]
    - name: "Card"
      file: "src/components/ui/Card.tsx"
      parts: ["CardHeader", "CardContent", "CardFooter", "CardTitle", "CardDescription"]
    - name: "Input"
      file: "src/components/ui/Input.tsx"
    - name: "Tabs"
      file: "src/components/ui/Tabs.tsx"
      parts: ["TabsList", "TabsTrigger", "TabsContent"]
    - name: "Switch"
      file: "src/components/ui/Switch.tsx"
    - name: "Checkbox"
      file: "src/components/ui/Checkbox.tsx"
    - name: "Select"
      file: "src/components/ui/Select.tsx"
    - name: "Dialog"
      file: "src/components/ui/Dialog.tsx"
    - name: "DropdownMenu"
      file: "src/components/ui/DropdownMenu.tsx"
    - name: "Toast"
      file: "src/components/ui/Toast.tsx"
    - name: "Tooltip"
      file: "src/components/ui/Tooltip.tsx"
    - name: "Badge"
      file: "src/components/ui/Badge.tsx"
      variants: ["default", "secondary", "destructive", "outline"]
    - name: "Label"
      file: "src/components/ui/Label.tsx"
    - name: "Skeleton"
      file: "src/components/ui/Skeleton.tsx"

  business:
    - name: "Header"
      file: "src/components/Header.tsx"
    - name: "Footer"
      file: "src/components/Footer.tsx"
    - name: "InputPanel"
      file: "src/components/InputPanel.tsx"
    - name: "OutputPanel"
      file: "src/components/OutputPanel.tsx"

hooks:
  - name: "useDomainData"
    file: "src/hooks/useDomainData.ts"
  - name: "useUrlManager"
    file: "src/hooks/useUrlManager.ts"
  - name: "useRules"
    file: "src/hooks/useRules.ts"
  - name: "useTheme"
    file: "src/hooks/useTheme.ts"
  - name: "useLanguage"
    file: "src/hooks/useLanguage.ts"

utils:
  - name: "fileUtils"
    file: "src/utils/fileUtils.ts"
    exports: ["isValidHttpUrl", "downloadOutput", "copyToClipboard", "fetchFromUrl", "fetchFromUrls"]
  - name: "uiUtils"
    file: "src/utils/uiUtils.ts"
  - name: "parser"
    file: "src/utils/parser.ts"
  - name: "rulesGenerator"
    file: "src/utils/rulesGenerator.ts"
  - name: "i18n"
    file: "src/utils/i18n.ts"

design_tokens:
  colors:
    primary: "#007AFF"
    success: "#22C55E"
    warning: "#F59E0B"
    danger: "#EF4444"
  spacing_unit: "4px"
  border_radius:
    sm: "6px"
    md: "8px"
    lg: "12px"
    xl: "16px"
    full: "9999px"

security:
  url_validation:
    max_length: 2048
    allowed_protocols: ["http:", "https:"]
  http_timeout: 10000
  csp:
    script_src: ["'self'", "'unsafe-inline'", "https://raw.githubusercontent.com"]
    style_src: ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
    font_src: ["'self'", "https://fonts.gstatic.com"]
    img_src: ["'self'", "data:", "https:", "blob:"]
    connect_src: ["'self'", "https://raw.githubusercontent.com", "https://easylist-downloads.adblockplus.org", "https://github.com"]
    frame_src: ["'none'"]
    object_src: ["'none'"]

supported_languages:
  - code: "zh-CN"
    name: "简体中文"
  - code: "zh-TW"
    name: "繁體中文"
  - code: "en"
    name: "English"
  - code: "ja"
    name: "日本語"
  - code: "ko"
    name: "한국어"
  - code: "es"
    name: "Español"
  - code: "fr"
    name: "Français"
  - code: "de"
    name: "Deutsch"
  - code: "it"
    name: "Italiano"
  - code: "pt"
    name: "Português"
  - code: "ru"
    name: "Русский"
  - code: "ar"
    name: "العربية"
  - code: "hi"
    name: "हिन्दी"
  - code: "th"
    name: "ไทย"

output_formats:
  - name: "Dnsmasq"
    extension: ".conf"
    template: "address=/{domain}/0.0.0.0"
  - name: "Hosts"
    extension: ".txt"
    template: "0.0.0.0 {domain}"
  - name: "AdGuard"
    extension: ".txt"
    template: "||{domain}^$dnsrewrite=0.0.0.0"

preset_sources:
  - name: "EasyList"
    url: "https://easylist-downloads.adblockplus.org/easylist.txt"
    enabled: true
  - name: "EasyList China"
    url: "https://easylist-downloads.adblockplus.org/easylistchina+easylist.txt"
    enabled: true

accessibility:
  minimum_touch_target: "44px"
  minimum_color_contrast: "4.5:1"
  keyboard_navigation: true
  screen_reader_support: true
  reduced_motion_support: true

build:
  port: 8082
  output_directory: ".next"
  typescript: true
  eslint: true
