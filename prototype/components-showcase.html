<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Shield — 组件库展示 v3.4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-primary:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-mono:'SF Mono','JetBrains Mono','Fira Code',monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;--ease-out:cubic-bezier(0,0,.2,1);--duration-fast:150ms}
[data-theme=dark]{--bg:#0A0A0F;--surface:#141419;--elevated:#1C1C24;--muted:#2C2C3A;--input:#1C1C24;--text:#F5F5F7;--text-secondary:#98989D;--text-tertiary:#6E6E73;--border:#2C2C3A;--border-hover:#3A3A4A;--primary:#0A84FF;--primary-hover:#4DA3FF;--primary-subtle:rgba(10,132,255,.15);--success:#30D158;--success-bg:rgba(48,209,88,.12);--warning:#FF9F0A;--warning-bg:rgba(255,159,10,.12);--error:#FF453A;--error-bg:rgba(255,69,58,.12);--shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow-md:0 4px 12px rgba(0,0,0,.3)}
[data-theme=light]{--bg:#fff;--surface:#F5F5F7;--elevated:#fff;--muted:#E8E8ED;--input:#F5F5F7;--text:#1D1D1F;--text-secondary:#6E6E73;--text-tertiary:#A1A1A6;--border:#D2D2D7;--border-hover:#86868B;--primary:#007AFF;--primary-hover:#0056D3;--primary-subtle:rgba(0,122,255,.1);--success:#34C759;--success-bg:rgba(52,199,89,.1);--warning:#FF9500;--warning-bg:rgba(255,149,0,.1);--error:#FF3B30;--error-bg:rgba(255,59,48,.1);--shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-primary);color:var(--text);background:var(--bg);transition:background .3s,color .3s;padding:var(--space-6)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-sm)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:0 0}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--radius-full)}
.app{max-width:1120px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-8);padding-bottom:var(--space-6);border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:var(--space-3)}
.header-meta{font-size:12px;color:var(--text-secondary);margin-top:4px}
.nav-tabs{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-bottom:var(--space-8)}
.nav-tab{padding:6px 14px;font-size:13px;font-weight:500;color:var(--text-secondary);background:0 0;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:all var(--duration-fast) var(--ease-out)}
.nav-tab:hover{border-color:var(--border-hover);color:var(--text)}
.nav-tab--active{background:var(--primary);color:#fff;border-color:var(--primary)}
.section{margin-bottom:var(--space-10)}
.section-title{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-5)}
.section-desc{font-size:13px;color:var(--text-secondary);margin-top:2px;font-weight:400}
.component-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-4);transition:background .3s,border-color .3s}
.component-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-2)}
.component-name code{font-size:12px;font-weight:400;color:var(--text-secondary);font-family:var(--font-mono);background:var(--muted);padding:2px 8px;border-radius:4px}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border)}
.demo-row:last-child{border-bottom:none}
.demo-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);min-width:80px}
.demo-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
@media (max-width:640px){.demo-grid-2{grid-template-columns:1fr}}
.demo-block{display:flex;flex-direction:column;gap:var(--space-2)}
.demo-block-label{font-size:11px;color:var(--text-tertiary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-primary);font-weight:500;line-height:1;border:1px solid transparent;cursor:pointer;user-select:none;white-space:nowrap;transition:all var(--duration-fast) var(--ease-out);position:relative;overflow:hidden;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn--sm{height:28px;padding:0 var(--space-2);font-size:11px;border-radius:var(--radius-sm)}
.btn--md{height:32px;padding:0 var(--space-3);font-size:12px;border-radius:var(--radius-md)}
.btn--lg{height:36px;padding:0 var(--space-4);font-size:13px;border-radius:var(--radius-md)}
.btn--xl{height:40px;padding:0 var(--space-5);font-size:14px;font-weight:600;border-radius:var(--radius-md)}
.btn--icon{padding:0;width:32px}
.btn--icon.btn--sm{width:28px}
.btn--icon.btn--lg{width:36px}
.btn--primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn--primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.btn--secondary{background:var(--elevated);color:var(--text);border-color:var(--border)}
.btn--secondary:hover:not(:disabled){border-color:var(--border-hover);background:var(--muted)}
.btn--ghost{background:0 0;color:var(--text-secondary);border-color:transparent}
.btn--ghost:hover:not(:disabled){background:var(--muted);color:var(--text)}
.btn--destructive{background:var(--error);color:#fff;border-color:var(--error)}
.btn--destructive:hover:not(:disabled){opacity:.9;box-shadow:var(--shadow-md)}
.btn--outline{background:0 0;color:var(--primary);border:1px solid var(--primary)}
.btn--outline:hover:not(:disabled){background:var(--primary-subtle)}
.btn-icon{width:14px;height:14px;flex-shrink:0}
.input{width:100%;height:36px;padding:0 var(--space-3);font-family:var(--font-primary);font-size:14px;color:var(--text);background:var(--input);border:1px solid var(--border);border-radius:var(--radius-md);outline:0;transition:all var(--duration-fast) var(--ease-out)}
.input::placeholder{color:var(--text-tertiary)}
.input:hover:not(:disabled):not(:focus){border-color:var(--border-hover)}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-subtle)}
.input--error{border-color:var(--error)}
.input--error:focus{box-shadow:0 0 0 3px var(--error-bg)}
.input--success{border-color:var(--success)}
.input:disabled{opacity:.5;cursor:not-allowed}
.input--with-left{padding-left:36px}
.input-label{display:block;font-size:12px;font-weight:500;margin-bottom:6px}
.input-error{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--error);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;line-height:1.4;letter-spacing:.02em;white-space:nowrap}
.badge--default{background:var(--muted);color:var(--text-secondary)}
.badge--primary{background:var(--primary-subtle);color:var(--primary)}
.badge--success{background:var(--success-bg);color:var(--success)}
.badge--warning{background:var(--warning-bg);color:var(--warning)}
.badge--error{background:var(--error-bg);color:var(--error)}
.badge--pill{border-radius:var(--radius-full)}
.badge-sm{font-size:10px;padding:1px 6px}
.card-demo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5);transition:background .3s,border-color .3s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.card-demo--elevated{background:var(--elevated)}
.card-demo--bordered{border-width:2px}
.card-demo:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card-label{font-size:12px;font-weight:600;margin-bottom:4px}
.card-text{font-size:12px;color:var(--text-secondary)}
.tabs-wrapper{display:inline-flex;padding:2px;background:var(--muted);border-radius:var(--radius-md);gap:2px}
.tab-item{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--text-secondary);background:0 0;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--duration-fast) var(--ease-out);white-space:nowrap}
.tab-item:hover{color:var(--text)}
.tab-item--active{background:var(--elevated);color:var(--text);box-shadow:var(--shadow-sm)}
.tag-demo{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--duration-fast) var(--ease-out);user-select:none}
.tag-demo--default{background:var(--muted);color:var(--text-secondary);border:1px solid transparent}
.tag-demo--default:hover{border-color:var(--border-hover);color:var(--text)}
.tag-demo--active{background:var(--primary);color:#fff}
.switch-demo{position:relative;width:36px;height:22px;cursor:pointer;display:inline-block}
.switch-demo input{opacity:0;width:0;height:0}
.switch-track{position:absolute;inset:0;background:var(--border);border-radius:var(--radius-full);transition:background var(--duration-fast) var(--ease-out)}
.switch-demo input:checked+.switch-track{background:var(--primary)}
.switch-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform var(--duration-fast) var(--ease-out);box-shadow:var(--shadow-sm)}
.switch-demo input:checked~.switch-thumb{transform:translateX(14px)}
.skeleton{background:var(--muted);border-radius:var(--radius-sm);position:relative;overflow:hidden}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--elevated) 50%,transparent),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.tooltip-demo{position:relative;display:inline-flex}
.tooltip-demo::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(.9);padding:4px 8px;font-size:11px;font-weight:500;color:var(--text);background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);white-space:nowrap;opacity:0;pointer-events:none;transition:all var(--duration-fast) var(--ease-out);box-shadow:var(--shadow-md)}
.tooltip-demo:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
.toast-demo{display:inline-flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);max-width:360px}
.toast-icon{width:18px;height:18px;flex-shrink:0}
.toast-icon--s{color:var(--success)}
.toast-icon--e{color:var(--error)}
.toast-icon--w{color:var(--warning)}
.toast-demo-content{flex:1}
.toast-demo-title{font-size:14px;font-weight:500}
.toast-demo-desc{font-size:12px;color:var(--text-secondary);margin-top:1px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <div class="header-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <div>
          <h1 style="font-size:20px;font-weight:700;letter-spacing:-.02em;">DNS Shield 组件库</h1>
          <div class="header-meta">Design System v3.4.0 · Swiss Modernism 2.0 × Apple Precision</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="themeBadge" class="badge badge--default" style="font-size:10px;letter-spacing:.05em;">深色模式</span>
        <button onclick="toggleTheme()" class="btn btn--sm btn--ghost" aria-label="切换主题"><svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>切换主题</button>
      </div>
    </div>
  </header>
  <nav class="nav-tabs">
    <button class="nav-tab nav-tab--active" onclick="scrollToSection('buttons')">Buttons</button>
    <button class="nav-tab" onclick="scrollToSection('inputs')">Inputs</button>
    <button class="nav-tab" onclick="scrollToSection('cards')">Cards</button>
    <button class="nav-tab" onclick="scrollToSection('badges')">Badges</button>
    <button class="nav-tab" onclick="scrollToSection('tabs-tags')">Tabs & Tags</button>
    <button class="nav-tab" onclick="scrollToSection('switches')">Switches</button>
    <button class="nav-tab" onclick="scrollToSection('editor')">Editor</button>
    <button class="nav-tab" onclick="scrollToSection('empty')">Empty States</button>
    <button class="nav-tab" onclick="scrollToSection('skeleton')">Skeleton</button>
    <button class="nav-tab" onclick="scrollToSection('toast')">Toasts</button>
  </nav>
  <section class="section" id="buttons">
    <h2 class="section-title"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>Button <span class="section-desc">按钮 — 4 种变体 · 4 种尺寸 · 5 种状态</span></h2>
    <div class="component-card"><div class="component-name">变体 <code>variant</code></div>
      <div class="demo-row"><span class="demo-label">Primary</span><button class="btn btn--md btn--primary"><span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>Primary</button><button class="btn btn--md btn--secondary">Secondary</button><button class="btn btn--md btn--ghost">Ghost</button><button class="btn btn--md btn--destructive">Destructive</button><button class="btn btn--md btn--outline">Outline</button></div>
    </div>
    <div class="component-card"><div class="component-name">尺寸 <code>size</code></div>
      <div class="demo-row"><span class="demo-label">Sizes</span><button class="btn btn--sm btn--primary">Small</button><button class="btn btn--md btn--primary">Medium</button><button class="btn btn--lg btn--primary">Large</button><button class="btn btn--xl btn--primary">X-Large</button></div>
    </div>
  </section>
</div>
<script>
let isDark=!0;document.documentElement.setAttribute('data-theme','dark');
function toggleTheme(){isDark=!isDark;document.documentElement.setAttribute('data-theme',isDark?'dark':'light');document.getElementById('themeBadge').textContent=isDark?'深色模式':'浅色模式'}
function scrollToSection(id){document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('nav-tab--active'));event.target.classList.add('nav-tab--active');document.getElementById(id).scrollIntoView({behavior:'smooth'})}
</script>
</body>
</html>
