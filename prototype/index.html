      --success: 142 70% 40%;

    /* Toast */
    .toast {

  </style>
</head>

  <script>
  (function () {
    'use strict';

    // ---- 国际化 (原型最小集，对齐 src/locales) ----
    var I18N = {
      'zh-cn': { name: '中文', sub: 'DNS 广告过滤规则生成器', input: '域名输入', output: '规则输出',
        blacklist: '黑名单', whitelist: '白名单', custom: '自定义DNS', comments: '注释',
        parse: '生成规则', sort: '排序', dedupe: '去重', clear: '清空', copy: '复制', download: '下载',
        copied: '已复制到剪贴板', noData: '没有可复制的内容' },
      'en': { name: 'English', sub: 'DNS Ad-blocking Rule Generator', input: 'Domain Input', output: 'Rule Output',
        blacklist: 'Blacklist', whitelist: 'Whitelist', custom: 'Custom DNS', comments: 'Comments',
        parse: 'Generate', sort: 'Sort', dedupe: 'Dedupe', clear: 'Clear', copy: 'Copy', download: 'Download',
        copied: 'Copied to clipboard', noData: 'Nothing to copy' }
    };
    var LANGS = [['zh-cn','中文'],['en','English'],['ja','日本語'],['ko','한국어'],['ru','Русский'],['es','Español'],['fr','Français'],['de','Deutsch']];

    // ---- 真实数据样本 (对齐 public/domains.txt 语法) ----
    var SAMPLE = [
      '# DNS Shield 示例域名',
      'doubleclick.net',
      'googleadservices.com',
      'googlesyndication.com',
      'adservice.google.com',
      '+mi.com',
      '+iot.mi.com',
      '@cdn.example.com=1.2.3.4',
      '!adblock-analytics.example.com',
      'ad.example.com'
    ].join('\n');

    var PRESETS = {
      builtin: SAMPLE,
      adguard: '||doubleclick.net^\n||googleadservices.com^\n+google-analytics.com',
      easylist: '||ads.example.com^\n||tracker.example.org^\n+trusted.example.com',
      neohosts: 'ad.neohost.cn\nbanner.neohost.cn\n+api.neohost.cn'
    };

    var settings = { projectName: 'DNS Shield', version: '3.7.48', ipv4: '127.0.0.1', ipv6: '::',
      addHeader: true, blockIPv6: false, dedupDomains: true, removeWildcard: true };

    var DOMAIN_REGEX = /^(?=.{1,253}$)([a-z0-9](-?[a-z0-9])*\.)+[a-z]{2,}$/i;
    var currentLang = localStorage.getItem('ds_lang') || 'zh-cn';
    var currentTheme = localStorage.getItem('ds_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var currentFmt = 'dnsmasq';
    var parsed = null;

    // ---- 解析 (对齐 src/utils/parser.ts + 3.7.29 白名单剔除语义) ----
    function normKey(d) { return d.trim().toLowerCase().replace(/^\*\./, ''); }
    function parseSource(src) {
      var lines = src.replace(/\r/g, '').split('\n');
      var domains = [], wl = [], custom = [], comments = 0;
      var seenWl = {};
      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i].trim();
        if (raw === '') continue;
        if (raw.charAt(0) === '#') { comments++; continue; }
        if (raw.charAt(0) === '!') { comments++; continue; }
        if (raw.charAt(0) === '+') {
          var w = normKey(raw.slice(1));
          if (!seenWl[w]) { seenWl[w] = true; if (DOMAIN_REGEX.test(w)) wl.push(w); else comments++; }
          continue;
        }
        if (raw.charAt(0) === '@') {
          var eq = raw.indexOf('=');
          if (eq > 1) { var cd = normKey(raw.slice(1, eq)); if (DOMAIN_REGEX.test(cd)) custom.push({ domain: cd, ip: raw.slice(eq + 1).trim() }); else comments++; }
          continue;
        }
        if (raw.indexOf('@@||') === 0) {
          var aw = raw.slice(4).replace(/\^\$?.*$/, ''); aw = normKey(aw);
          if (!seenWl[aw]) { seenWl[aw] = true; if (DOMAIN_REGEX.test(aw)) wl.push(aw); else comments++; }
          continue;
        }
        var d = normKey(raw);
        if (DOMAIN_REGEX.test(d)) domains.push(d); else comments++;
      }
      if (settings.dedupDomains) { domains = uniq(domains).sort(); wl = uniq(wl).sort(); }
      // 3.7.29: 白名单域名不进入拦截列表
      var wlSet = {}; wl.forEach(function (x) { wlSet[x] = true; });
      domains = domains.filter(function (x) { return !wlSet[x]; });
      return { domains: domains, whitelist: wl, customDns: custom, comments: comments };
    }
    function uniq(a) { var s = {}, r = []; a.forEach(function (x) { if (!s[x]) { s[x] = 1; r.push(x); } }); return r; }

    // ---- 生成 (对齐 src/utils/rulesGenerator.ts) ----
    function header(title) {
      return settings.addHeader
        ? '# ' + settings.projectName + ' - ' + title + '\n# 版本: ' + settings.version + ' | 域名: ' + parsed.domains.length + ' 个\n'
        : '';
    }
    function genDnsmasq() {
      var out = header('Dnsmasq 格式 (address=/domain/ip)') + '\n';
      parsed.domains.forEach(function (d) { out += 'address=/' + d + '/' + settings.ipv4 + '\n'; });
      if (settings.blockIPv6 && settings.ipv6) parsed.domains.forEach(function (d) { out += 'address=/' + d + '/' + settings.ipv6 + '\n'; });
      parsed.customDns.forEach(function (c) { out += 'address=/' + c.domain + '/' + c.ip + '\n'; });
      parsed.whitelist.forEach(function (d) { out += 'server=/' + d + '/  # 已白名单\n'; });
      return out;
    }
    function genHosts() {
      var out = header('Hosts 格式 (ip domain)') + '\n';
      parsed.domains.forEach(function (d) { out += settings.ipv4 + ' ' + d + '\n'; });
      if (settings.blockIPv6 && settings.ipv6) parsed.domains.forEach(function (d) { out += settings.ipv6 + ' ' + d + '\n'; });
      parsed.customDns.forEach(function (c) { out += c.ip + ' ' + c.domain + '\n'; });
      parsed.whitelist.forEach(function (d) { out += '# 已白名单: ' + d + '\n'; });
      return out;
    }
    function genAdguard() {
      var out = header('AdGuard 格式 (||domain^)') + '\n';
      parsed.domains.forEach(function (d) { out += '||' + d + '^\n'; });
      parsed.customDns.forEach(function (c) { out += '||' + c.domain + '^$dnsrewrite=NOERROR;A;' + c.ip + '\n'; });
      return out;
    }
    function genWhitelist() {
      var out = header('白名单列表') + '\n';
      parsed.whitelist.forEach(function (d) { out += '@@||' + d + '^$important\n'; });
      return out;
    }
    // 3.7.48 新增 5 种格式
    function genUnbound() {
      var out = header('Unbound 格式 (local-zone refuse)') + '\n';
      parsed.domains.forEach(function (d) { out += 'local-zone: "' + d + '" refuse\n'; });
      parsed.whitelist.forEach(function (d) { out += 'local-zone: "' + d + '" transparent\n'; });
      return out;
    }
    function genPihole() {
      var out = header('Pi-hole 格式 (0.0.0.0 domain)') + '\n';
      parsed.domains.forEach(function (d) { out += '0.0.0.0 ' + d + '\n'; });
      parsed.customDns.forEach(function (c) { out += c.ip + ' ' + c.domain + '\n'; });
      return out;
    }
    function genDomains() {
      var out = header('纯域名列表') + '\n';
      parsed.domains.forEach(function (d) { out += d + '\n'; });
      parsed.whitelist.forEach(function (d) { out += '# 已白名单: ' + d + '\n'; });
      return out;
    }
    function genBind() {
      var out = header('Bind RPZ (CNAME .)') + '\n';
      parsed.domains.forEach(function (d) { out += d + ' CNAME .\n*.' + d + ' CNAME .\n'; });
      return out;
    }
    function genSmartdns() {
      var out = header('SmartDNS 格式 (address /domain/#)') + '\n';
      parsed.domains.forEach(function (d) { out += 'address /' + d + '/#\n'; });
      parsed.customDns.forEach(function (c) { out += 'server /' + c.domain + '/' + c.ip + '\n'; });
      parsed.whitelist.forEach(function (d) { out += '# 已白名单: ' + d + '\n'; });
      return out;
    }
    function generate() {
      switch (currentFmt) {
        case 'dnsmasq': return genDnsmasq();
        case 'hosts': return genHosts();
        case 'adguard': return genAdguard();
        case 'whitelist': return genWhitelist();
        case 'unbound': return genUnbound();
        case 'pihole': return genPihole();
        case 'domains': return genDomains();
        case 'bind': return genBind();
        case 'smartdns': return genSmartdns();
      }
      return '';
    }

    // ---- 渲染 ----
    var $ = function (id) { return document.getElementById(id); };
    function renderStats() {
      $('statDomains').textContent = parsed.domains.length;
      $('statWhitelist').textContent = parsed.whitelist.length;
      $('statCustom').textContent = parsed.customDns.length;
      $('statComments').textContent = parsed.comments;
    }
    function renderGutter() {
      var n = $('editor').value.split('\n').length;
      var s = ''; for (var i = 1; i <= n; i++) s += i + '\n';
      $('gutter').textContent = s.trim();
    }
    function renderPreview() {
      var txt = generate();
      // 轻量高亮（仅注释/白名单），无 XSS 风险（textContent）
      var esc = txt.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      esc = esc.replace(/^(#.*)$/gm, '<span class="cmt">$1</span>')
               .replace(/^(@@\|\|.*)$/gm, '<span class="wl">$1</span>')
               .replace(/^(# 已白名单:.*)$/gm, '<span class="wl">$1</span>');
      $('preview').innerHTML = esc;
    }
    function renderAll() {
      parsed = parseSource($('editor').value);
      renderStats(); renderPreview();
    }

    function applyI18n() {
      var t = I18N[currentLang] || I18N['en'];
      $('brandSub').textContent = t.sub;
      $('inputTitle').textContent = t.input;
      $('outputTitle').textContent = t.output;
      $('lblDomains').textContent = t.blacklist;
      $('lblWhitelist').textContent = t.whitelist;
      $('lblCustom').textContent = t.custom;
      $('lblComments').textContent = t.comments;
      $('lblParse').textContent = t.parse;
      $('lblSort').textContent = t.sort;
      $('lblDedupe').textContent = t.dedupe;
      $('lblClear').textContent = t.clear;
      $('lblCopy').textContent = t.copy;
      $('lblDownload').textContent = t.download;
      $('langLabel').textContent = (I18N[currentLang] || I18N['en']).name;
    }
    function applyTheme() {
      document.documentElement.classList.toggle('dark', currentTheme === 'dark');
      var icon = $('themeIcon');
      icon.innerHTML = currentTheme === 'dark'
        ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }

    function toast(msg) {
      var el = $('toast'); el.textContent = msg; el.classList.add('show');
      setTimeout(function () { el.classList.remove('show'); }, 1800);
    }
    function download() {
      var fmt = currentFmt === 'whitelist' ? 'whitelist' : currentFmt;
      var name = fmt === 'whitelist' ? 'whitelist.txt' : 'dns-shield.' + fmt;
      var blob = new Blob([generate()], { type: 'text/plain' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      URL.revokeObjectURL(a.href);
    }

    // ---- 事件 ----
    $('editor').addEventListener('input', function () { renderGutter(); renderAll(); });
    $('editor').addEventListener('scroll', function () { $('gutter').scrollTop = this.scrollTop; });
    $('parseBtn').addEventListener('click', renderAll);
    $('sortBtn').addEventListener('click', function () {
      var p = parseSource($('editor').value);
      var lines = [].concat(p.domains, p.whitelist.map(function (d) { return '+' + d; }),
        p.customDns.map(function (c) { return '@' + c.domain + '=' + c.ip; }));
      $('editor').value = lines.join('\n'); renderGutter(); renderAll();
    });
    $('dedupeBtn').addEventListener('click', renderAll);
    $('clearBtn').addEventListener('click', function () { $('editor').value = ''; renderGutter(); renderAll(); });
    $('copyBtn').addEventListener('click', function () {
      var txt = generate(); if (!txt.trim()) { toast((I18N[currentLang]||I18N.en).noData); return; }
      navigator.clipboard.writeText(txt).then(function () { toast((I18N[currentLang]||I18N.en).copied); });
    });
    $('downloadBtn').addEventListener('click', download);

    Array.prototype.forEach.call(document.querySelectorAll('#formatTabs .tab'), function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('#formatTabs .tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active'); currentFmt = tab.dataset.fmt; renderPreview();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#presets .preset'), function (p) {
      p.addEventListener('click', function () {
        document.querySelectorAll('#presets .preset').forEach(function (x) { x.classList.remove('active'); });
        p.classList.add('active');
        $('editor').value = PRESETS[p.dataset.preset] || SAMPLE; renderGutter(); renderAll();
      });
    });

    $('themeBtn').addEventListener('click', function () {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('ds_theme', currentTheme); applyTheme();
    });

    // 语言下拉
    var langMenu = $('langMenu');
    LANGS.forEach(function (l) {
      var item = document.createElement('div');
      item.className = 'dd-item' + (l[0] === currentLang ? ' active' : '');
      item.setAttribute('role', 'menuitem');
      item.innerHTML = '<span>' + l[1] + '</span>' + (l[0] === currentLang ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '');
      item.addEventListener('click', function () {
        currentLang = l[0]; localStorage.setItem('ds_lang', currentLang);
        langMenu.querySelectorAll('.dd-item').forEach(function (x) { x.classList.remove('active'); x.querySelector('svg') && x.removeChild(x.querySelector('svg')); });
        item.classList.add('active');
        var chk = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        chk.setAttribute('width', '14'); chk.setAttribute('height', '14'); chk.setAttribute('viewBox', '0 0 24 24');
        chk.setAttribute('fill', 'none'); chk.setAttribute('stroke', 'currentColor'); chk.setAttribute('stroke-width', '3');
        chk.setAttribute('stroke-linecap', 'round'); chk.setAttribute('stroke-linejoin', 'round');
        chk.innerHTML = '<path d="M20 6 9 17l-5-5"/>'; item.appendChild(chk);
        langMenu.classList.remove('open'); $('langBtn').setAttribute('aria-expanded', 'false');
        applyI18n();
      });
      langMenu.appendChild(item);
    });
    $('langBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var open = langMenu.classList.toggle('open');
      $('langBtn').setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function () { langMenu.classList.remove('open'); $('langBtn').setAttribute('aria-expanded', 'false'); });

    // ---- 初始化 ----
    document.documentElement.lang = currentLang;
    $('editor').value = SAMPLE;
    applyTheme(); applyI18n(); renderGutter(); renderAll();
  })();
  </script>
</body>
</html>
